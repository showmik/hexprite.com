name: Sync Latest Release

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch:      # Manual trigger button in GitHub Actions
  repository_dispatch:    # Trigger via GitHub API / action from showmik/hexprite
    types: [release-published]

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build latest release HTML
        run: npm run build:html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/release.json *.html
          if git diff --staged --quiet; then
            echo "No release updates detected."
          else
            VERSION=$(node -e "console.log(require('./data/release.json').tag_name)")
            git commit -m "chore: sync release to ${VERSION} [skip ci]"
            git push
          fi
